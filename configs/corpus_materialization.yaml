# Corpus Materialization Plan for Gate C1
# Project: cambacica-base-180m
# Gate: C1 (CORPUS)
# Status: plan (NOT execution state; downloads must NOT occur during plan phase)

schema_version: 1
gate: "C1"
status: "plan"
plan_date: "2026-10-01"

storage:
  root_path: "/mnt/data/cambacica-base-180m"
  filesystem_type: "NFSv4 (10.10.10.1:/srv/data)"
  measured_capacity: "66 TB total, 64 TB free (3% utilized)"
  estimated_peak_working_volume: "165-240 GB (<0.38% of available storage)"
  paths:
    raw: "/mnt/data/cambacica-base-180m/raw"
    normalized: "/mnt/data/cambacica-base-180m/normalized"
    deduplicated: "/mnt/data/cambacica-base-180m/deduplicated"
    scratch: "/mnt/data/cambacica-base-180m/scratch"

sources:
  carolina:
    canonical_name: "carolina"
    repository: "carolina-c4ai/corpus-carolina"
    pinned_revision: "v2.0.1"
    pinned_commit_sha: "55e63a519393c70a48dcfa14a558499c6bb0583b"
    acquisition_mode: "full_corpus_acquisition"
    description: >
      Acquire all 823 XML.GZ shards preserving TEI headers and document metadata
      across all 7 taxonomies (dat, wik, jud, uni, soc, leg, pub).
    destination: "/mnt/data/cambacica-base-180m/raw/carolina/"
    estimated_raw_size: "8.3 GB"
    estimated_normalized_size: "12-16 GB"
    checksum_provenance_requirements: >
      Git commit SHA-256 verification and per-shard payload integrity checks against
      upstream HuggingFace repository commit.

  wikipedia_pt:
    canonical_name: "wikipedia_pt"
    repository: "wikimedia/wikipedia"
    config: "20231101.pt"
    pinned_revision: "20231101.pt"
    pinned_commit_sha: "b04c8d1ceb2f5cd4588862100d08de323dccfbaa"
    acquisition_mode: "full_snapshot_articles"
    description: >
      Acquire the official Wikimedia 20231101 Portuguese encyclopedic articles dataset dump.
    destination: "/mnt/data/cambacica-base-180m/raw/wikipedia/"
    estimated_raw_size: "2.5 GB"
    estimated_normalized_size: "7-9 GB"
    checksum_provenance_requirements: >
      Official Wikimedia dump hash and HuggingFace commit SHA-256 verification.

  parlamento_pt:
    canonical_name: "parlamento_pt"
    repository: "PORTULAN/parlamento-pt"
    pinned_revision: "main"
    pinned_commit_sha: "08f13e7e63ab9bfbd8c0b40955defe3bb7f68c2b"
    acquisition_mode: "full_file_acquisition"
    description: >
      Acquire raw train.txt containing Portuguese parliamentary proceedings and speeches.
    destination: "/mnt/data/cambacica-base-180m/raw/parlamento/"
    estimated_raw_size: "2.7 GB"
    estimated_normalized_size: "3-4 GB"
    checksum_provenance_requirements: >
      Git commit SHA-256 verification and raw text line/byte count verification.

  gutenberg_pt:
    canonical_name: "gutenberg_pt"
    repository: "project_gutenberg_pt"
    pinned_revision: "snapshot_2026-10-01"
    snapshot_date: "2026-10-01"
    catalog_query: "browse/languages/pt"
    catalog_size_ebooks: 655
    acquisition_mode: "full_catalog_snapshot"
    description: >
      Batch acquisition of 655 Portuguese-language plain-text eBooks listed in the
      Project Gutenberg catalog query snapshot as of 2026-10-01.
    destination: "/mnt/data/cambacica-base-180m/raw/gutenberg/"
    estimated_raw_size: "0.4 GB"
    estimated_normalized_size: "0.5 GB"
    checksum_provenance_requirements: >
      Deterministic list of 655 validated eBook IDs, raw text checksums, and standard
      header/footer boilerplate stripping verification.
    provenance_note: >
      Project acquisition snapshot based on Portuguese language catalog query as of
      2026-10-01 (655 eligible eBooks); project acquisition snapshot, not an immutable
      upstream Git commit as upstream does not provide one.

  gigaverbo_v2:
    canonical_name: "gigaverbo_v2"
    repository: "Polygl0t/gigaverbo-v2"
    split: "edu_high"
    pinned_revision: "edu_high"
    pinned_commit_sha: "7058ccf19eaeaf4505a96fc7e5305a01fc441fd8"
    exclusions_config: "configs/gigaverbo_exclusions.yaml"
    acquisition_mode: "selective_row_group_filtered_streaming"
    description: >
      Acquisition is row-group/subset filtered across the pinned edu_high partition (56 shards).
      Do NOT model desired subsets as whole selected shards because subsets are physically
      clustered and distributed at row-group level across shards. Shards are streamed, and records
      matching blocked subsets (e.g. ultrachat, xlsum, carolina, wikipedia) are discarded before
      persisting local raw Parquet buffers.
    destination: "/mnt/data/cambacica-base-180m/raw/gigaverbo/"
    estimated_raw_size: "25-35 GB"
    estimated_normalized_size: "20-30 GB"
    checksum_provenance_requirements: >
      Pinned HuggingFace commit SHA-256, Parquet shard checksums, and deterministic
      exclusion filter verification via configs/gigaverbo_exclusions.yaml.
