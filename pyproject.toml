[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cambacica"
version = "0.1.0"
description = "Natively Portuguese small decoder-only causal language model (~180M)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0",
    "requests>=2.25.0",
    "xxhash>=3.0.0",
    "huggingface-hub>=0.20.0",
    "datasets>=2.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
