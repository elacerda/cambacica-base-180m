[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cambacica"
version = "0.1.0"
description = "Natively Portuguese small decoder-only causal language model (~180M)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0",
    "requests>=2.25.0",
    "xxhash>=3.0.0",
    "huggingface-hub>=0.20.0",
    "datasets>=2.16.0",
]

[project.scripts]
near-census = "cambacica.corpus.dedup.near_census:main"
tokenizer-sample = "cambacica.corpus.tokenizer_sample:main"
cambacica-tokenizer = "cambacica.tokenizer.experiments:main"
cambacica-benchmark = "cambacica.benchmark.cli:main"
cambacica-c3-scalability = "cambacica.benchmark.scalability_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]
tokenizer = [
    "pyarrow==24.0.0",
    "sentencepiece==0.2.2",
]
c3 = [
    "torch>=2.3.0",
    "nvidia-ml-py>=12.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
